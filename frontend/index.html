<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Know Your Building</title>
<meta name="description" content="City records and tenant voices for any San Francisco address.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --paper:#f6f2ea; --surface:#fffdf9; --ink:#191d22; --muted:#5a6068; --line:#d9d3c7;
  --city:#1f4560; --city-tint:#e6edf2; --city-line:#bccbd6;
  --voice:#5c2d7e; --voice-tint:#f1e9f6; --voice-line:#d8c6e5;
  --green:#22693f; --green-tint:#e0f0e5; --orange:#9a5200; --orange-tint:#fbecd6; --red:#ab2319; --red-tint:#fae3e0;
  --serif:"Fraunces",Georgia,"Songti SC","Noto Serif SC",serif;
  --sans:"IBM Plex Sans",-apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --wrap:1120px; --radius:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans)}
h1,h2,h3,p{margin:0}
h1,h2{font-family:var(--serif);font-weight:600;letter-spacing:-.015em;line-height:1.1}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--city);outline-offset:2px;border-radius:4px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono)}
.eyebrow{font:500 12px/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 18px;border:1px solid var(--ink);border-radius:999px;background:var(--ink);color:#fff;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:#343a42}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:rgba(0,0,0,.06)}
.btn.voice{background:var(--voice);border-color:var(--voice)}
.btn.voice:hover{background:#49216a}
.btn[disabled]{opacity:.55;cursor:default}
.link{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

.mockbar{background:#191d22;color:#fff;font:500 13px/1.4 var(--mono);text-align:center;padding:7px 16px}
.bar{position:sticky;top:0;z-index:1000;background:rgba(246,242,234,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;min-height:62px;padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;cursor:pointer;font:700 19px/1 var(--serif);letter-spacing:-.01em;white-space:nowrap}
.brand svg{flex:none}
.barsearch{flex:1;display:flex;max-width:480px;margin-left:auto}
.barsearch input{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-right:0;border-radius:999px 0 0 999px;background:var(--surface);padding:0 16px}
.barsearch button{height:42px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:0 999px 999px 0;padding:0 16px;font-weight:600;cursor:pointer}
.lang{margin-left:auto;height:42px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 8px}
.barsearch + .lang{margin-left:0}

/* landing */
.hero{padding:72px 0 56px;display:grid;grid-template-columns:1.35fr .65fr;gap:48px;align-items:end}
.hero h1{font-size:clamp(44px,7vw,84px);max-width:11em}
.hero .lede{font-size:20px;max-width:32em;margin-top:22px;color:#3d4249}
.bigsearch{display:flex;margin-top:32px;max-width:640px;background:var(--surface);border:2px solid var(--ink);border-radius:14px;overflow:hidden}
.bigsearch input{flex:1;min-width:0;border:0;background:transparent;padding:18px 20px;font-size:19px}
.bigsearch input:focus{outline:none}
.bigsearch:focus-within{box-shadow:0 0 0 3px rgba(31,69,96,.3)}
.bigsearch button{border:0;background:var(--ink);color:#fff;padding:0 26px;font-weight:600;font-size:17px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.chip-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font:400 13px var(--mono);cursor:pointer;min-height:36px}
.chip-btn:hover{border-color:var(--ink)}
.street{display:flex;align-items:flex-end;justify-content:flex-end;gap:5px;height:330px}
.street svg{display:block}
.threeup{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);margin-bottom:72px}
.threeup>div{padding:22px 24px 0 0}
.threeup>div+div{padding-left:24px;border-left:1px solid var(--line)}
.threeup h2{font-size:24px;margin:8px 0}
.c-city{color:var(--city)} .c-voice{color:var(--voice)}

/* states */
.state{min-height:58vh;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:16px;padding:64px 0}
.state h1{font-size:clamp(34px,5vw,54px);max-width:16em}
.steps{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:9px;font-family:var(--mono);font-size:14px}
.steps li{color:#99a0a7;display:flex;gap:10px;align-items:center}
.steps li::before{content:"";width:10px;height:10px;border:1.5px solid currentColor;border-radius:50%}
.steps li.on{color:var(--ink)}
.steps li.on::before{border-right-color:transparent;animation:spin .8s linear infinite}
.steps li.done{color:var(--green)}
.steps li.done::before{background:currentColor}
@keyframes spin{to{transform:rotate(360deg)}}

/* result header */
.addr{padding-top:44px;padding-bottom:24px}
.addr h1{font-size:clamp(38px,6.2vw,72px);overflow-wrap:anywhere}
.addr .meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;color:var(--muted);font:400 14px var(--mono)}
.subnav{position:sticky;top:62px;z-index:900;background:var(--paper);border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.subnav .wrap{display:flex;gap:24px;overflow-x:auto;scrollbar-width:none}
.subnav a{display:block;padding:12px 0;font-weight:500;font-size:14px;text-decoration:none;white-space:nowrap}
.subnav a:hover{text-decoration:underline}
section[id],#block{scroll-margin-top:126px}
.person>.btn,.person div>.btn{white-space:nowrap;flex:none}

/* report */
.report{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:44px;padding:40px 0 56px}
.stamp{display:inline-flex;align-items:center;gap:9px;border:2px solid currentColor;border-radius:7px;padding:6px 13px;font:500 13px/1.25 var(--mono);letter-spacing:.05em;text-transform:uppercase;transform:rotate(-1.4deg)}
.stamp svg{flex:none}
.lv-green{color:var(--green)} .lv-orange{color:var(--orange)} .lv-red{color:var(--red)}
.report h2.headline{font-size:clamp(30px,4vw,44px);margin:20px 0 14px}
.summary{font-size:18px;max-width:38em}
.ai-note{margin-top:12px;color:var(--muted);font-size:13px}
.signals{list-style:none;margin:28px 0 0;padding:0;border-top:1px solid var(--line)}
.signal{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px}
.dot.green{background:var(--green-tint);color:var(--green)}
.dot.orange{background:var(--orange-tint);color:var(--orange)}
.dot.red{background:var(--red-tint);color:var(--red)}
.signal h3{font-size:16px;font-weight:600;line-height:1.35}
.signal p{font-size:15px;color:#3d4249;margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1.3 var(--mono);border-radius:5px;padding:3px 7px;margin-top:6px;text-decoration:none}
.tag.city{background:var(--city-tint);color:var(--city)}
.tag.voice{background:var(--voice-tint);color:var(--voice)}
.tag.fict{background:#ececec;color:#3f3f3f}
.tag.ok{background:var(--green-tint);color:var(--green)}
a.tag:hover{text-decoration:underline}
.questions{margin-top:30px;padding:20px 22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.questions header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.questions h3{font:600 20px/1.2 var(--serif)}
.questions ol{margin:12px 0 0;padding-left:22px}
.questions li{margin:6px 0}
.disclaimer{margin-top:18px;padding-left:12px;border-left:3px solid var(--ink);font-size:13.5px;color:#3d4249}
.side{display:flex;flex-direction:column;gap:18px}
#map{height:280px;border-radius:var(--radius);border:1px solid var(--city-line);background:#dfe5e7;z-index:1}
.map-fallback{display:grid;place-items:center;height:100%;padding:16px;font:400 13px var(--mono);color:var(--muted);text-align:center}
.pin{width:20px;height:20px;background:var(--ink);border:3px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,.5)}
.profile{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:end;padding:18px;background:var(--city-tint);border:1px solid var(--city-line);border-radius:var(--radius)}
.profile dl{margin:0;display:grid;gap:8px}
.profile dt{font:500 11px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--city)}
.profile dd{margin:1px 0 0;font-weight:600}
.profile .eyebrow{grid-column:1/-1;color:var(--city)}
.rentnote{grid-column:1/-1;font-size:13px;border-top:1px solid var(--city-line);padding-top:10px}

/* bands */
.band{padding:52px 0 60px}
.band.city{background:var(--city-tint);border-top:4px solid var(--city)}
.band.voice{background:var(--voice-tint);border-top:4px solid var(--voice)}
.band.people{background:var(--surface);border-top:4px solid var(--ink)}
.band-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.band-head h2{font-size:clamp(30px,4.2vw,44px);margin-top:7px}
.band-head p{max-width:38em;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--city-line);margin-bottom:32px}
.stat{padding:16px 16px 16px 0}
.stat+.stat{padding-left:16px;border-left:1px solid var(--city-line)}
.stat b{display:block;font:600 40px/1 var(--serif)}
.stat span{font-size:13.5px;display:block;margin-top:5px}
.stat.alert b{color:var(--red)}
.stat em{font:500 11px var(--mono);font-style:normal;color:var(--city);display:block;margin-top:3px}
.records{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(250px,1fr);gap:40px}
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--city-line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px 9px 0;margin-right:10px;font-weight:600;cursor:pointer;min-height:44px;color:#4a5a66}
.tabs button[aria-selected=true]{border-color:var(--city);color:var(--ink)}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:104px 1fr auto;gap:14px;padding:12px 0;border-bottom:1px solid var(--city-line);align-items:start}
.rows time{font:400 13px/1.6 var(--mono);color:#40505c}
.rows small{display:block;color:#4a5a66;margin-top:2px}
.status{font:500 11.5px/1.3 var(--mono);padding:3px 7px;border-radius:5px;background:#fff;color:#40505c;white-space:nowrap}
.status.open{background:var(--red-tint);color:var(--red)}
.unsafe{display:inline-block;font:500 11.5px var(--mono);color:var(--red);background:var(--red-tint);padding:2px 6px;border-radius:4px;margin-top:4px}
.empty{padding:18px 0;color:var(--muted)}
.bars{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:11px}
.bars label,.bars .lab{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.track{height:7px;background:rgba(31,69,96,.13);border-radius:4px;margin-top:4px}
.fill{height:100%;background:var(--city);border-radius:4px}
.subhead{font:600 21px/1.2 var(--serif)}
.source{display:inline-block;margin-top:12px;font:400 12.5px var(--mono);color:var(--city)}
.blockpanel{margin-top:42px;padding:24px;border:2px dashed var(--city);border-radius:var(--radius);background:rgba(255,255,255,.45)}
.blockflag{display:inline-block;background:var(--city);color:#fff;font:500 12px/1.3 var(--mono);padding:5px 9px;border-radius:5px}
.blockgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:36px;margin-top:20px}
.yearbars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px;height:110px;align-items:end;margin-top:14px}
.yb{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font:400 11px var(--mono)}
.yb i{display:block;width:100%;background:var(--city);border-radius:3px 3px 0 0;min-height:1px}
.yb span{margin-top:4px;color:#40505c}
.chiplist{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chiplist span{font-size:13px;background:#fff;border-radius:5px;padding:3px 8px}
.renttable{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
.renttable th{font:500 11.5px var(--mono);text-transform:uppercase;text-align:left;color:var(--city);padding:0 0 6px}
.renttable td{padding:9px 0;border-top:1px solid var(--city-line)}

/* voices */
.opinion-flag{display:inline-block;background:var(--voice);color:#fff;font:500 12px/1.3 var(--mono);padding:5px 9px;border-radius:5px}
.voice-grid{display:grid;grid-template-columns:minmax(240px,.75fr) minmax(0,2fr);gap:40px}
.avg .big{font:600 58px/1 var(--serif);color:var(--voice)}
.avg .big small{font-size:20px;color:var(--muted)}
.bars.voiced .track{background:rgba(92,45,126,.15)}
.bars.voiced .fill{background:var(--voice)}
.tv{padding:18px 20px;background:#fff;border-radius:var(--radius);margin-bottom:18px;border-left:4px solid var(--voice)}
.review{padding:20px 0;border-top:1px solid var(--voice-line)}
.review header{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.review header b{font-weight:600}
.review .tag{margin-top:0}
.review blockquote{margin:10px 0 8px;font:400 19px/1.45 var(--serif)}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips i{width:8px;height:8px;border-radius:50%;background:var(--voice);display:block}
.pips i.off{background:rgba(92,45,126,.2)}

/* people */
.people-grid{display:grid;grid-template-columns:1fr 1fr;gap:44px}
.person{padding:18px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.person b{font-weight:600}
.person p{font-size:15px;margin-top:5px}
.person .tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.person .tag{margin-top:0}
.score{font:600 25px/1 var(--serif)}
.life{font-size:13px;color:var(--muted);margin-top:5px}
.me{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px;margin-bottom:14px}

footer{padding-top:34px;padding-bottom:52px;font-size:13.5px;color:var(--muted)}
.leaflet-tile-pane{filter:saturate(.35) contrast(.95)}
footer a{margin-right:12px}

/* dialog */
dialog{width:min(600px,calc(100vw - 24px));max-height:calc(100dvh - 24px);border:0;border-radius:14px;padding:0;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,22,26,.55)}
.dlg{padding:26px}
.dlg h2{font-size:30px;padding-right:44px}
.dlg .close{position:absolute;right:14px;top:14px;width:44px;height:44px;border:0;border-radius:50%;background:none;cursor:pointer;font-size:24px}
.field{display:block;margin-top:16px}
.field>span,fieldset legend{display:block;font-weight:600;font-size:14px;margin-bottom:5px;padding:0}
fieldset{border:0;padding:0;margin:0}
.field input:not([type=checkbox]),.field select,.field textarea{width:100%;min-height:44px;border:1px solid #a7a296;border-radius:8px;background:#fff;padding:9px 11px}
.field textarea{min-height:110px;resize:vertical}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.check{display:flex;align-items:flex-start;gap:9px;margin-top:14px;font-size:15px}
.check input{margin-top:5px;width:17px;height:17px;flex:none}
.rate{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rate legend{float:left;margin:0;font-weight:500}
.rate .opts{display:flex;gap:5px;margin-left:auto}
.rate label{position:relative}
.rate input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.rate span{display:grid;place-items:center;width:38px;height:38px;border:1px solid #a7a296;border-radius:8px;font:500 14px var(--mono)}
.rate input:checked+span{background:var(--voice);border-color:var(--voice);color:#fff}
.rate input:focus-visible+span{outline:3px solid var(--voice);outline-offset:2px}
.privacy{margin-top:16px;padding:12px 14px;background:var(--green-tint);border-radius:8px;font-size:13.5px}
.formerr{margin-top:14px;padding:11px 13px;background:var(--red-tint);color:var(--red);border-radius:8px;font-size:14px}
.formactions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:3000;max-width:calc(100vw - 32px);background:var(--ink);color:#fff;border-radius:10px;padding:12px 18px;font-size:14.5px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.toast:empty{display:none}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;padding-top:44px}
  .street{display:none}
  .threeup{grid-template-columns:1fr;margin-bottom:44px}
  .threeup>div,.threeup>div+div{padding:18px 0;border-left:0;border-bottom:1px solid var(--line)}
  .report,.records,.blockgrid,.voice-grid,.people-grid{grid-template-columns:minmax(0,1fr);gap:30px}
  .stats{grid-template-columns:1fr 1fr}
  .stat:nth-child(3){padding-left:0;border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--city-line)}
}
@media (max-width:620px){
  .wrap{padding:0 16px}
  .bar .wrap{flex-wrap:wrap;gap:8px 10px;min-height:0}
  .barsearch{order:3;flex:1 0 100%;max-width:none}
  .lang,.barsearch + .lang{margin-left:auto}
  .subnav{top:0;position:static}
  section[id],#block{scroll-margin-top:118px}
  .bigsearch{flex-direction:column}
  .bigsearch button{padding:14px}
  .rows li{grid-template-columns:1fr auto}
  .rows li time{grid-column:1/-1}
  .two{grid-template-columns:1fr}
  .profile{grid-template-columns:1fr}
  .profile .facade{display:none}
  .dlg{padding:20px 16px}
  .person{flex-direction:column}
  .person .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.steps li.on::before{animation:none}}
</style>
</head>
<body>
<div id="mockbar"></div>
<header class="bar" id="bar"></header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
/* =========================== i18n =========================== */
const I18N = {

  const o=m[3]?{year:"numeric",month:"short",day:"numeric",timeZone:"UTC"}:{year:"numeric",month:"short",timeZone:"UTC"};

/* =========================== API =========================== */
async function api(path,opts){
  const res=await fetch(path,opts);
  let body=null; try{body=await res.json()}catch(e){}
  if(!res.ok){const err=new Error((body&&(body.error||body.detail))||"HTTP "+res.status);err.status=res.status;err.hasMsg=!!(body&&(body.error||typeof body.detail==="string"));throw err}
  return body;
}
const mockJson = f=>fetch(new URL("../mocks/"+f,location.href)).then(r=>{if(!r.ok)throw new Error(f);return r.json()});
async function getReport(address,lang){
  if(MOCK){
    const [building,report,community]=await Promise.all([mockJson("mock_building.json"),mockJson("mock_report.json"),mockJson("mock_community.json")]);
    await new Promise(r=>setTimeout(r,500));
    building.query_address=address; return {building,report,community};
  }
  return api(`/api/report?address=${encodeURIComponent(address)}&lang=${encodeURIComponent(lang)}`);
}
async function postReview(reviewIn,proof){
  if(MOCK){
    await new Promise(r=>setTimeout(r,500));
    if(/\b(idiot|stupid)\b/i.test(reviewIn.text)) return {status:"rejected",verified:false,reason:"Mock moderation rejected this text."};
    return {status:"published",verified:!!proof,reason:""};
  }
  const fd=new FormData(); fd.append("review",JSON.stringify(reviewIn)); if(proof) fd.append("proof",proof);
  return api("/api/reviews",{method:"POST",body:fd});
}
async function postProfile(p){
  if(MOCK) return {...p,id:"mock-me",verified:false,demo:false};
  return api("/api/profiles",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});
}
const getMatches = id=>MOCK?mockJson("mock_roommates.json"):api(`/api/roommates?profile_id=${encodeURIComponent(id)}`);
async function postContact(b){
  if(MOCK) return {ok:true};
  return api("/api/contact",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
}

function facade(stories,units,w=86){
  const floors=Math.min(Math.max(+stories||3,1),10), cols=Math.min(Math.max(Math.ceil((+units||floors)/(+stories||floors)),2),6);
  const wW=8,wH=11,gap=5,pad=7,W=cols*wW+(cols-1)*gap+pad*2,H=floors*(wH+gap)+24;
  let wins="";
  for(let f=0;f<floors;f++)for(let c=0;c<cols;c++){
    const lit=((f*7+c*13+floors)%5)===0;
    wins+=`<rect x="${pad+c*(wW+gap)}" y="${11+f*(wH+gap)}" width="${wW}" height="${wH}" fill="${lit?"#e9a93a":"#dde6ec"}"/>`;
  }
  const doorX=W/2-5;
  return `<svg class="facade" width="${w}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><rect y="4" width="${W}" height="${H-4}" fill="#1f4560"/><rect x="-0" y="0" width="${W}" height="5" fill="#191d22"/>${wins}<rect x="${doorX}" y="${H-11}" width="10" height="11" fill="#191d22"/></svg>`;
}

const levelMark={green:"✓",orange:"!",red:"✕"};
function stamp(level){
  const icon=level==="green"?`<path d="M3 8l3.5 3.5L13 5" fill="none" stroke="currentColor" stroke-width="2"/>`:level==="orange"?`<path d="M8 3v6.5M8 12v1.5" stroke="currentColor" stroke-width="2"/>`:`<path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2"/>`;
  return `<span class="stamp lv-${esc(level)}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">${icon}</svg>${esc(t(level))}</span>`;
}
function signalHtml(s,b){
  const lv=levelMark[s.level]?s.level:"orange";
  const isVoice=s.source==="community_reviews";
  const url=!isVoice&&b.sources&&safeUrl(b.sources[s.source]);
  const tag=isVoice?`<a class="tag voice" href="#voices">${esc(t("sig_tenant"))}</a>`
    :url?`<a class="tag city" href="${esc(url)}" target="_blank" rel="noopener">${esc(t("sig_city"))} ↗</a>`:`<span class="tag city">${esc(t("sig_city"))}</span>`;
  return `<li class="signal"><span class="dot ${lv}" aria-label="${esc(t(lv))}">${levelMark[lv]}</span><div><h3>${esc(s.title)}</h3><p>${esc(s.detail)}</p>${tag}</div></li>`;
}
function reportInner(){
  const {report:r,building:b}=state.data;

  const order={red:0,orange:1,green:2};

  const qsList=r.questions_to_ask_landlord||[];

    <p class="ai-note">${esc(t("ai_note"))}</p>

    <div class="small muted">${pips(rt.overall)} <span class="sr">${esc(t("r_overall"))}:</span> ${num(rt.overall)}/5</div>
  </article>`;
}
function voicesInner(){

function lifeLine(l){
  if(!l) return "";

}
function contactBtn(p){
  const sent=state.sent[p.id];
  return `<button class="btn ghost" data-a="contact" data-v="${esc(p.id)}" data-p="${esc(p.pseudo)}"${sent?" disabled":""}>${esc(t(sent?"sent":"ask"))}</button>`;
}
function personTags(p){
  return `<span class="tags"><b>${esc(p.pseudo)}</b><span class="tag city">${esc(t("role_"+p.role))}</span>${p.verified?`<span class="tag ok">✓ ${esc(t("verified"))}</span>`:""}${p.demo?`<span class="tag fict">${esc(t("fict"))}</span>`:""}</span>`;
}
function peopleInner(){
  const c=state.data.community||{};
  const me=state.profile;
  const list=(c.contactable_tenants||[]).filter(p=>!me||p.id!==me.id);
  const seeking=me&&(me.role==="seeking_roommate"||me.role==="has_room");
  let rm;
  if(!me) rm=`<button class="btn" data-a="profile" style="margin-top:16px">${esc(t("rm_cta"))}</button>`;
  else if(!seeking) rm=`<p class="empty">${esc(t("rm_tenant_note"))}</p><button class="btn" data-a="profile">${esc(t("rm_cta"))}</button>`;
  else if(!state.matches) rm=`<p class="empty">…</p>`;
  else if(!state.matches.length) rm=`<p class="empty">${esc(t("rm_none"))}</p>`;
  else rm=state.matches.map(m=>{
    const p=m.profile||{}; const s=+m.score; const pct=isNaN(s)?null:Math.round(s<=1?s*100:s);
    const budget=(p.budget_min!=null||p.budget_max!=null)?`${money(p.budget_min)}–${money(p.budget_max)}`:"";
    return `<div class="person"><div>${personTags(p)}
      <p>${esc(m.why)}</p>
      <p class="life">${[esc(p.neighborhood),budget&&esc(t("budget"))+" "+esc(budget),p.move_in&&esc(t("move_in"))+" "+fmtDate(p.move_in)].filter(Boolean).join(" · ")}</p>
      <p class="life">${lifeLine(p.lifestyle)}</p></div>
      <div style="text-align:right;flex:none">${pct!=null?`<div class="score">${pct}%</div><div class="small muted" style="margin-bottom:8px">${esc(t("match"))}</div>`:""}${contactBtn(p)}</div></div>`;
  }).join("");
  return `<div class="band-head"><div><span class="eyebrow">${esc(t("nav_people"))}</span><h2>${esc(t("ppl_title"))}</h2><p>${esc(t("ppl_sub"))}</p></div></div>
    ${me?`<div class="me"><span>${esc(t("you"))} <b>${esc(me.pseudo)}</b> (${esc(t("role_"+me.role))})</span><button class="link small" data-a="forget">${esc(t("forget"))}</button></div>`:""}
    <div class="people-grid">
      <div><h3 class="subhead">${esc(t("ppl_tenants"))}</h3>
        ${list.length?`<div style="margin-top:12px">${list.map(p=>`<div class="person"><div>${personTags(p)}<p>${esc(p.bio)}</p></div>${contactBtn(p)}</div>`).join("")}</div>`:`<p class="empty">${esc(t("ppl_none"))}</p>`}
      </div>
      <div><h3 class="subhead">${esc(t("rm_title"))}</h3><p class="small muted" style="margin:4px 0 12px">${esc(t("rm_sub"))}</p>${rm}</div>
    </div>`;
}
function resultsView(){
  const b=state.data.building, s=b.stats||{};
  return `<div class="wrap addr">
      <h1>${esc(b.matched_address||b.query_address)}</h1>
      <div class="meta">${b.neighborhood?`<span>${esc(b.neighborhood)}</span>`:""}${b.supervisor_district?`<span>${esc(t("district"))} ${esc(b.supervisor_district)}</span>`:""}${b.blklot?`<span>${esc(t("parcel"))} ${esc(b.blklot)}</span>`:""}</div>

        <div class="stat"><b>${num(s.violations_10y)}</b><span>${esc(t("st_v"))}</span><em>${esc(t("tenyears"))}</em></div>

      </div>
      <div class="records">
        <div id="records">${recordsInner()}</div>
        <div><h3 class="subhead">${esc(t("near"))}</h3>${nearby(b.neighborhood_311)}</div>

      ${blockPanel(b)}
    </div></section>
    <section id="voices" class="band voice"><div class="wrap" id="voicesInner">${voicesInner()}</div></section>

    <footer class="wrap"><p>${esc(t("disclaimer"))}</p></footer>`;
}
function initMap(){
  const b=state.data.building, el=$("#map"); if(!el) return;
  if(b.lat==null||b.lon==null){el.style.display="none";return}
  try{
    const map=L.map(el,{scrollWheelZoom:false}).setView([b.lat,b.lon],16);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
    L.circle([b.lat,b.lon],{radius:150,color:"#1f4560",weight:1.5,fillOpacity:.07,dashArray:"4 5"}).addTo(map);
    L.marker([b.lat,b.lon],{icon:L.divIcon({className:"",html:'<div class="pin"></div>',iconSize:[20,20],iconAnchor:[10,10]}),title:b.matched_address||""}).addTo(map);
  }catch(e){ el.innerHTML=`<div class="map-fallback">${esc(b.lat)}, ${esc(b.lon)}</div>`; }
}
function refreshInner(){
  const set=(id,fn)=>{const el=document.getElementById(id); if(el&&state.data) el.innerHTML=fn()};
  set("reportInner",reportInner); set("voicesInner",voicesInner); set("peopleInner",peopleInner);
}

/* =========================== loading flow =========================== */
async function load(address,{silent=false,push=true}={}){
  const id=++state.reqId;
  state.address=address;
  if(push&&!silent) pushUrl();
  let timer;
  if(!silent){
    state.view="loading"; render(); window.scrollTo(0,0);
    let i=0; timer=setInterval(()=>{
      const li=document.querySelectorAll("#steps li"); if(!li.length||i>=li.length-1){clearInterval(timer);return}
      li[i].className="done"; li[++i].className="on";
    },1700);
  }
  try{
    const data=await getReport(address,state.lang);
    if(id!==state.reqId) return;
    clearInterval(timer);
    state.data=data; state.tab="c"; state.showAll={};
    if(silent){refreshInner();return}
    state.view="results"; render();
    loadMatches();
  }catch(e){
    if(id!==state.reqId) return;
    clearInterval(timer);
    if(silent){toast(t("generic_err"));return}
    state.error=e; state.view="error"; render();
  }
}
async function loadMatches(){
  const me=state.profile;
  if(!me||!(me.role==="seeking_roommate"||me.role==="has_room")) return;
  try{ state.matches=await getMatches(me.id); }
  catch(e){ state.matches=[]; }
  const el=$("#peopleInner"); if(el) el.innerHTML=peopleInner();
}

/* =========================== dialogs =========================== */
const dlg=$("#dlg");
function openDlg(html){
  dlg.innerHTML=`<div class="dlg"><button class="close" data-a="close" aria-label="Close">×</button>${html}</div>`;
  dlg.showModal();
}
function reviewDialog(){
  openDlg(`<h2>${esc(t("f_review_title"))}</h2>
  <form data-f="review">
    <label class="field"><span>${esc(t("f_pseudo"))}</span><input name="pseudo" required maxlength="40" autocomplete="off" value="${esc(state.profile?state.profile.pseudo:"")}"><p class="hint">${esc(t("f_pseudo_h"))}</p></label>
    <div class="two">
      <label class="field"><span>${esc(t("f_start"))}</span><input type="month" name="period_start" required placeholder="YYYY-MM" pattern="\\d{4}-\\d{2}"></label>
      <label class="field"><span>${esc(t("f_end"))}</span><input type="month" name="period_end" placeholder="YYYY-MM" pattern="\\d{4}-\\d{2}"></label>
    </div>
    <label class="check"><input type="checkbox" name="still" data-c="still"> ${esc(t("f_still"))}</label>
    <p class="field" style="font-weight:600;font-size:14px;margin-bottom:0">${esc(t("f_ratings"))}</p>
    ${RATING_KEYS.map(k=>`<fieldset class="rate"><legend>${esc(t("r_"+k))}</legend><div class="opts">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="r_${k}" value="${n}" aria-label="${esc(t("r_"+k))}: ${n}"><span>${n}</span></label>`).join("")}</div></fieldset>`).join("")}
    <label class="field"><span>${esc(t("f_text"))}</span><textarea name="text" required minlength="10" maxlength="2000"></textarea><p class="hint">${esc(t("f_text_h"))}</p></label>
    <label class="field"><span>${esc(t("f_proof"))}</span><input type="file" name="proof" accept="image/*,application/pdf"><p class="hint">${esc(t("f_proof_h"))}</p></label>
    <p class="privacy">${esc(t("f_privacy"))}</p>
    <div class="formerr" hidden role="alert"></div>
    <div class="formactions"><button type="button" class="btn ghost" data-a="close">${esc(t("f_cancel"))}</button><button class="btn voice">${esc(t("f_publish"))}</button></div>
  </form>`);
}
function profileDialog(note){
  const n=state.data&&state.data.building?state.data.building.neighborhood:"";
  const defaultRole=state.pendingContact?"seeking_roommate":"seeking_roommate";
  const opt=(arr,pfx)=>arr.map(v=>`<option value="${v}">${esc(t(pfx+v))}</option>`).join("");
  openDlg(`<h2>${esc(t("f_profile_title"))}</h2>${note?`<p class="hint" style="margin-top:8px">${esc(note)}</p>`:""}
  <form data-f="profile">
    <label class="field"><span>${esc(t("f_pseudo"))}</span><input name="pseudo" required maxlength="40" autocomplete="off"><p class="hint">${esc(t("f_pseudo_h"))}</p></label>
    <label class="field"><span>${esc(t("f_role"))}</span><select name="role" data-c="role">${["seeking_roommate","has_room","current_tenant","former_tenant"].map(v=>`<option value="${v}"${v===defaultRole?" selected":""}>${esc(t("role_"+v))}</option>`).join("")}</select></label>
    <label class="field"><span>${esc(t("f_nhood"))}</span><input name="neighborhood" value="${esc(n)}" required></label>
    <div data-roommate>
      <div class="two">
        <label class="field"><span>${esc(t("f_bmin"))}</span><input type="number" name="budget_min" min="0" step="50"></label>
        <label class="field"><span>${esc(t("f_bmax"))}</span><input type="number" name="budget_max" min="0" step="50"></label>
      </div>
      <label class="field"><span>${esc(t("move_in"))}</span><input type="month" name="move_in" placeholder="YYYY-MM" pattern="\\d{4}-\\d{2}"></label>
    </div>
    <label class="field"><span>${esc(t("f_bio"))}</span><textarea name="bio" maxlength="400" style="min-height:70px"></textarea><p class="hint">${esc(t("f_bio_h"))}</p></label>
    <div class="two">
      <label class="field"><span>${esc(t("f_sched"))}</span><select name="schedule">${opt(["early","late","flexible"],"f_sched_")}</select></label>
      <label class="field"><span>${esc(t("f_guests"))}</span><select name="guests">${opt(["rarely","sometimes","often"],"f_g_")}</select></label>
    </div>
    <label class="field"><span>${esc(t("f_cleanl"))}</span><select name="cleanliness">${[1,2,3,4,5].map(v=>`<option${v===3?" selected":""}>${v}</option>`).join("")}</select></label>
    <label class="check"><input type="checkbox" name="smoking"> ${esc(t("f_smoke"))}</label>
    <label class="check"><input type="checkbox" name="pets"> ${esc(t("f_pets"))}</label>
    <label class="check"><input type="checkbox" name="open_to_contact"> ${esc(t("f_open"))}</label>
    <div class="formerr" hidden role="alert"></div>
    <div class="formactions"><button type="button" class="btn ghost" data-a="close">${esc(t("f_cancel"))}</button><button class="btn">${esc(t("f_create"))}</button></div>
  </form>`);
}
function contactDialog(id,pseudo){
  if(!state.profile){ state.pendingContact={id,pseudo}; profileDialog(t("contact_first")); return; }
  openDlg(`<h2>${esc(t("f_contact_title",{p:pseudo}))}</h2>
  <form data-f="contact" data-id="${esc(id)}">
    <label class="field"><span>${esc(t("f_msg"))}</span><textarea name="message" required maxlength="800"></textarea><p class="hint">${esc(t("f_msg_h"))}</p></label>
    <div class="formerr" hidden role="alert"></div>
    <div class="formactions"><button type="button" class="btn ghost" data-a="close">${esc(t("f_cancel"))}</button><button class="btn">${esc(t("f_send"))}</button></div>
  </form>`);
}
function formError(form,msg){const e=$(".formerr",form);e.textContent=msg;e.hidden=false;e.scrollIntoView({block:"nearest"})}
const errMsg=e=>e&&e.hasMsg?e.message:t("generic_err");

/* =========================== form handlers =========================== */
async function submitReview(form){
  const fd=new FormData(form), ratings={};
  for(const k of RATING_KEYS){const v=fd.get("r_"+k); if(!v){formError(form,t("f_rate_err"));return} ratings[k]=+v}
  const proofFile=fd.get("proof"); const proof=proofFile&&proofFile.size?proofFile:null;
  const reviewIn={blklot:state.data.building.blklot,pseudo:fd.get("pseudo").trim(),period_start:fd.get("period_start"),
    period_end:fd.get("still")||!fd.get("period_end")?null:fd.get("period_end"),ratings,text:fd.get("text").trim()};
  const btn=$("button.voice",form),label=btn.textContent; btn.disabled=true;btn.textContent=t("f_checking");$(".formerr",form).hidden=true;
  try{
    const res=await postReview(reviewIn,proof);
    if(res.status!=="published"){formError(form,t("rejected")+" "+(res.reason||""));return}
    dlg.close(); toast(t(res.verified?"pub_ver":"pub_ok"));
    if(MOCK){
      const c=state.data.community;
      c.reviews.unshift({...reviewIn,id:"mock-"+Date.now(),verified:!!res.verified,status:"published",created_at:new Date().toISOString(),demo:false});
      c.n_reviews=(c.n_reviews||0)+1; if(res.verified)c.n_verified=(c.n_verified||0)+1;
      refreshInner();
    } else load(state.address,{silent:true});
  }catch(e){formError(form,errMsg(e))}
  finally{btn.disabled=false;btn.textContent=label}
}
async function submitProfile(form){
  const f=new FormData(form), role=f.get("role"), rm=role==="seeking_roommate"||role==="has_room";
  const b=state.data&&state.data.building;
  const intOrNull=v=>v===""||v==null?null:parseInt(v,10);
  const p={pseudo:f.get("pseudo").trim(),role,blklot:(role==="current_tenant"||role==="former_tenant")&&b?b.blklot:null,
    neighborhood:f.get("neighborhood").trim(),budget_min:rm?intOrNull(f.get("budget_min")):null,budget_max:rm?intOrNull(f.get("budget_max")):null,
    move_in:rm&&f.get("move_in")?f.get("move_in"):null,bio:f.get("bio").trim(),
    lifestyle:{schedule:f.get("schedule"),cleanliness:+f.get("cleanliness"),guests:f.get("guests"),smoking:!!f.get("smoking"),pets:!!f.get("pets")},
    open_to_contact:!!f.get("open_to_contact")};
  const btn=$("button:not([type=button])",form); btn.disabled=true; $(".formerr",form).hidden=true;
  try{
    state.profile=await postProfile(p); store.set("kyb_profile",state.profile); state.matches=null;
    dlg.close(); toast(t("prof_ok"));
    const el=$("#peopleInner"); if(el) el.innerHTML=peopleInner();
    loadMatches();
    if(state.pendingContact){const c=state.pendingContact;state.pendingContact=null;contactDialog(c.id,c.pseudo)}
  }catch(e){formError(form,errMsg(e))}
  finally{btn.disabled=false}
}
async function submitContact(form){
  const to=form.dataset.id, message=new FormData(form).get("message").trim();
  const btn=$("button:not([type=button])",form); btn.disabled=true; $(".formerr",form).hidden=true;
  try{
    const r=await postContact({from_profile_id:state.profile.id,to_profile_id:to,message});
    if(r&&r.ok===false) throw new Error();
    state.sent[to]=true; dlg.close(); toast(t("contact_ok"));
    const el=$("#peopleInner"); if(el) el.innerHTML=peopleInner();
  }catch(e){formError(form,errMsg(e))}
  finally{btn.disabled=false}
}

/* =========================== events =========================== */
document.addEventListener("submit",e=>{
  const f=e.target, k=f.dataset.f; if(!k) return;
  e.preventDefault();
  if(k==="search"){const a=new FormData(f).get("address").trim(); if(a) load(a)}
  else if(k==="review") submitReview(f);
  else if(k==="profile") submitProfile(f);
  else if(k==="contact") submitContact(f);
});
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]"); if(!el) return;
  const a=el.dataset.a, v=el.dataset.v;
  if(a==="home"){state.reqId++;state.view="landing";state.address="";state.data=null;pushUrl();render();window.scrollTo(0,0)}
  else if(a==="example") load(v);
  else if(a==="retry") load(state.address);
  else if(a==="tab"){state.tab=v;$("#records").innerHTML=recordsInner();$(`#records [data-v="${v}"]`).focus()}
  else if(a==="toggleall"){state.showAll[state.tab]=!state.showAll[state.tab];$("#records").innerHTML=recordsInner()}
  else if(a==="copyq"){
    const text=(state.data.report.questions_to_ask_landlord||[]).map((q,i)=>`${i+1}. ${q}`).join("\n");
    (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>toast(t("copied")),()=>toast(t("generic_err")));
  }
  else if(a==="review") reviewDialog();
  else if(a==="profile"){state.pendingContact=null;profileDialog()}
  else if(a==="contact") contactDialog(v,el.dataset.p);
  else if(a==="close"){state.pendingContact=null;dlg.close()}
  else if(a==="forget"){state.profile=null;state.matches=null;store.set("kyb_profile",null);$("#peopleInner").innerHTML=peopleInner()}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="lang"){
    state.lang=el.value; store.set("kyb_lang",state.lang);
    if(state.address) load(state.address); else {pushUrl();render()}
  } else if(el.dataset.c==="still"){
    const end=el.form.elements.period_end; end.disabled=el.checked; if(el.checked) end.value="";
  } else if(el.dataset.c==="role"){
    const rm=el.value==="seeking_roommate"||el.value==="has_room";
    $("[data-roommate]",el.form).hidden=!rm;
  }
});
dlg.addEventListener("click",e=>{ if(e.target===dlg){state.pendingContact=null;dlg.close()} });
window.addEventListener("popstate",()=>{
  const q=new URLSearchParams(location.search), a=q.get("address");
  if(a) load(a,{push:false}); else {state.reqId++;state.view="landing";state.address="";state.data=null;render()}
});

/* =========================== start =========================== */
const initial=qs.get("address");
if(initial) load(initial,{push:false}); else render();
</script>
