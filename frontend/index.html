<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Know Your Building</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* =====================================================================
   DESIGN — trois influences :
   · Liquid Glass (Apple) : verre clair et léger qui flotte sur la carte
   · Pixels (Mistral) : logo, icônes, jauges et chiffres en blocs
   · Palette Elastic : turquoise, rose, jaune, bleu ciel, bleu
   ===================================================================== */
:root {
  --teal: #00BFB3; --pink: #F04E98; --yellow: #FEC514; --sky: #1BA9F5; --blue: #0077CC; --ink: #101C3F;
  --good: #0BA596; --warn: #D99A00; --bad: #E5455A;
  --text: #101C3F; --muted: #5F6880; --faint: #8A92A6;
  --glass: linear-gradient(140deg, rgba(255,255,255,.62), rgba(255,255,255,.34));
  --glass-solid: rgba(255,255,255,.72);
  --tile: rgba(255,255,255,.55);
  --rim: rgba(255,255,255,.7);
  --hair: rgba(16,28,63,.08);
  --shadow: 0 12px 40px rgba(16,28,63,.12), 0 1px 3px rgba(16,28,63,.06);
  --blur: blur(24px) saturate(190%) brightness(1.05);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
  --pixel: "Pixelify Sans", ui-monospace, monospace;
  --spring: cubic-bezier(.2, .9, .25, 1.08);
  --bg: #EEF1F6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --text: #EEF1F8; --muted: #A7AFC2; --faint: #7D869C;
    --glass: linear-gradient(140deg, rgba(34,40,60,.62), rgba(20,24,38,.42));
    --glass-solid: rgba(30,36,54,.82); --tile: rgba(255,255,255,.07); --rim: rgba(255,255,255,.16);
    --hair: rgba(255,255,255,.09); --shadow: 0 12px 40px rgba(0,0,0,.45); --bg: #0E1120;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--font); color: var(--text); background: var(--bg); overflow: hidden; -webkit-font-smoothing: antialiased; font-size: 15px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }

/* --- Verre : dégradé translucide + liseré lumineux en haut à gauche --- */
.glass {
  background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid var(--rim); box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.75), inset 1px 0 0 rgba(255,255,255,.35);
}

/* --- Carte --- */
#map { position: fixed; inset: 0; z-index: 0; background: var(--bg); }
.leaflet-control-zoom { display: none; }
.leaflet-control-attribution { font-size: 10px; background: var(--glass-solid) !important; border-radius: 8px 0 0 0; color: var(--muted) !important; }
.leaflet-control-attribution a { color: var(--muted) !important; }
.leaflet-popup-content-wrapper { border-radius: 16px; background: var(--glass-solid); color: var(--text); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--shadow); }
.leaflet-popup-tip { background: var(--glass-solid); }
.leaflet-popup-content { margin: 12px 14px; font: 13px/1.45 var(--font); }

/* --- Barre de recherche --- */
.topbar { position: fixed; z-index: 30; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
  width: min(640px, calc(100% - 24px)); display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; border-radius: 999px; }
.brand { font-family: var(--pixel); font-weight: 700; font-size: 16px; white-space: nowrap; letter-spacing: .01em; }
.searchform { flex: 1; display: flex; gap: 6px; min-width: 0; }
.searchform input { flex: 1; min-width: 0; border: 0; background: var(--tile); border-radius: 999px; padding: 10px 14px; outline: none; }
.searchform input:focus { box-shadow: 0 0 0 2px var(--sky); }
.searchform input::placeholder { color: var(--faint); }
.round { border: 0; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; flex: none; background: var(--blue); color: #fff; transition: transform .2s var(--spring); }
.round:active { transform: scale(.9); }
.round:disabled { opacity: .5; }
.langsel { border: 0; background: var(--tile); border-radius: 999px; padding: 9px 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
@media (max-width: 640px) { .brand { display: none; } }
@media (min-width: 1100px) { .topbar { left: calc(50% + 200px); width: min(560px, calc(100% - 460px)); } }

/* --- Calques : une pilule compacte --- */
.layers { position: fixed; z-index: 25; top: 72px; right: 14px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.lpill { display: flex; gap: 2px; padding: 4px; border-radius: 999px; }
.lbtn { border: 0; background: none; border-radius: 999px; padding: 7px 11px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; transition: all .25s var(--spring); }
.lbtn[aria-pressed=true] { background: var(--glass-solid); color: var(--text); box-shadow: 0 1px 6px rgba(16,28,63,.12), inset 0 1px 0 rgba(255,255,255,.8); }
.lbtn i { width: 8px; height: 8px; display: block; }
.legend { padding: 8px 12px; border-radius: 14px; font-size: 11px; color: var(--muted); min-width: 180px; }
.legend .ramp { display: flex; gap: 2px; margin: 5px 0 3px; }
.legend .ramp span { flex: 1; height: 8px; }
.legend .ends { display: flex; justify-content: space-between; }
@media (max-width: 899px) {
  .layers { top: 66px; left: 12px; right: 12px; align-items: stretch; }
  .lpill { overflow-x: auto; scrollbar-width: none; }
  .legend { display: none; }
}

/* --- Feuille de contenu --- */
.sheet { position: fixed; z-index: 20; border-radius: 26px; display: flex; flex-direction: column; overflow: hidden; transition: transform .5s var(--spring); }
.grab { border: 0; background: none; padding: 8px 0 0; cursor: pointer; display: flex; justify-content: center; flex: none; }
.grab span { width: 36px; height: 5px; border-radius: 3px; background: var(--hair); }
.body { overflow-y: auto; padding: 4px 18px 22px; flex: 1; overscroll-behavior: contain; scrollbar-width: thin; }
@media (min-width: 900px) { .sheet { left: 14px; top: 14px; bottom: 96px; width: 400px; } .grab { display: none; } .body { padding-top: 16px; } }
@media (max-width: 899px) { .sheet { left: 8px; right: 8px; bottom: 86px; height: 58vh; } .sheet.collapsed { transform: translateY(calc(58vh - 60px)); } }

/* --- Dock --- */
.dock { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom)); border-radius: 999px; padding: 5px; display: flex; gap: 2px; }
@media (min-width: 900px) { .dock { left: 214px; } }
.dock button { border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 70px; padding: 8px 10px 6px; border-radius: 999px; font-size: 11px; font-weight: 600; color: var(--muted); transition: all .3s var(--spring); }
.dock button[aria-selected=true] { color: var(--text); background: var(--glass-solid); box-shadow: 0 2px 10px rgba(16,28,63,.12), inset 0 1px 0 rgba(255,255,255,.85); }

/* --- Pixels --- */
.pix { display: inline-grid; flex: none; }
.pix i { display: block; }
.pixline { display: flex; gap: 3px; margin: 2px 0 12px; }
.pixline i { width: 6px; height: 6px; display: block; }
.gauge { display: flex; gap: 3px; }
.gauge i { width: 14px; height: 14px; display: block; background: var(--hair); }
.prate { display: inline-flex; gap: 2px; vertical-align: middle; }
.prate i { width: 9px; height: 9px; display: block; background: var(--hair); }
.num { font-family: var(--pixel); font-weight: 700; letter-spacing: .01em; }

/* --- Typo & blocs --- */
h1 { font-size: 24px; letter-spacing: -0.025em; margin: 2px 0 6px; font-weight: 800; line-height: 1.15; }
h2 { font-size: 16px; margin: 0 0 6px; font-weight: 700; letter-spacing: -0.01em; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 700; margin: 20px 0 8px; }
p { margin: 6px 0; line-height: 1.5; }
.muted { color: var(--muted); } .small { font-size: 13px; } .tiny { font-size: 12px; }
.tile { background: var(--tile); border-radius: 18px; padding: 14px; margin: 10px 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.stat { background: var(--tile); border-radius: 14px; padding: 10px; }
.stat .num { display: block; font-size: 22px; line-height: 1.1; }
.stat span { font-size: 11.5px; color: var(--muted); line-height: 1.25; display: block; margin-top: 2px; }
.tag { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; border-radius: 999px; padding: 3px 9px; font-size: 12px; font-weight: 700; background: var(--tile); }
.tag.good { color: var(--good); background: rgba(11,165,150,.12); } .tag.warn { color: var(--warn); background: rgba(217,154,0,.14); }
.tag.bad { color: var(--bad); background: rgba(229,69,90,.12); } .tag.blue { color: var(--blue); background: rgba(0,119,204,.10); }
.dot { width: 8px; height: 8px; display: inline-block; flex: none; }
.btn { border: 0; border-radius: 999px; padding: 10px 16px; background: var(--blue); color: #fff; font-weight: 700; cursor: pointer; transition: transform .2s var(--spring), opacity .2s; font-size: 14px; }
.btn:active { transform: scale(.96); } .btn:disabled { opacity: .5; cursor: wait; }
.btn.ghost { background: var(--tile); color: var(--text); }
.btn.sm { padding: 7px 12px; font-size: 13px; } .btn.block { width: 100%; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 4px; }
.field { margin: 10px 0; }
.field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
.input { width: 100%; border: 1px solid var(--hair); background: var(--glass-solid); border-radius: 12px; padding: 10px 12px; }
textarea.input { min-height: 84px; resize: vertical; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg { display: flex; gap: 2px; background: var(--glass-solid); border-radius: 12px; padding: 3px; margin: 10px 0; overflow-x: auto; scrollbar-width: none; position: sticky; top: -4px; z-index: 2; -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
.seg button { flex: 1; border: 0; background: none; border-radius: 9px; padding: 7px 9px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); white-space: nowrap; }
.seg button[aria-selected=true] { background: var(--glass-solid); color: var(--text); box-shadow: 0 1px 4px rgba(16,28,63,.12); }
.list { list-style: none; padding: 0; margin: 6px 0; }
.list li { padding: 9px 0; border-top: 1px solid var(--hair); font-size: 13.5px; line-height: 1.4; }
.list li:first-child { border-top: 0; }
.list .when { color: var(--faint); font-size: 12px; }
.err { background: rgba(229,69,90,.12); color: var(--bad); border-radius: 14px; padding: 10px 12px; margin: 10px 0; font-size: 14px; }
.foot { font-size: 11.5px; color: var(--faint); margin-top: 20px; line-height: 1.45; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.chip { border: 1px solid var(--hair); background: var(--glass-solid); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.chip:hover { border-color: var(--sky); }
.click { cursor: pointer; }
input[type=range] { width: 100%; accent-color: var(--blue); }

/* Verdict */
.verdict { border-radius: 20px; padding: 16px; margin: 6px 0 4px; background: var(--tile); }
.verdict .lvl { font-family: var(--pixel); font-size: 20px; font-weight: 700; margin: 10px 0 2px; }

/* Thèmes du rapport (dépliables) */
details.theme { background: var(--tile); border-radius: 18px; margin: 8px 0; overflow: hidden; }
details.theme summary { list-style: none; cursor: pointer; padding: 13px 14px; display: flex; gap: 12px; align-items: center; }
details.theme summary::-webkit-details-marker { display: none; }
details.theme .ttl { flex: 1; min-width: 0; }
details.theme .ttl b { display: block; font-size: 15px; }
details.theme .ttl span { font-size: 12.5px; color: var(--muted); display: block; margin-top: 1px; }
details.theme .chev { transition: transform .3s var(--spring); color: var(--faint); }
details.theme[open] .chev { transform: rotate(90deg); }
details.theme .inner { padding: 0 14px 14px; }
.src { font-size: 12px; color: var(--blue); text-decoration: none; }

/* Avis */
.review { padding: 12px 0; border-top: 1px solid var(--hair); }
.review:first-child { border-top: 0; }
.rhead { display: flex; align-items: center; gap: 10px; }
.av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; flex: none; font-size: 14px; }
.vbadge { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--good); white-space: nowrap; }

/* Chargement pixel */
.loader { display: flex; gap: 4px; justify-content: center; padding: 22px 0 10px; }
.loader i { width: 10px; height: 10px; display: block; animation: blink 1s infinite steps(2); }
.loader i:nth-child(2) { animation-delay: .12s } .loader i:nth-child(3) { animation-delay: .24s } .loader i:nth-child(4) { animation-delay: .36s } .loader i:nth-child(5) { animation-delay: .48s }
@keyframes blink { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
.loadmsg { text-align: center; color: var(--muted); font-size: 14px; padding-bottom: 10px; }

/* Chat */
.msgs { display: flex; flex-direction: column; gap: 8px; padding: 4px 0 8px; }
.msg { max-width: 88%; padding: 9px 13px; border-radius: 18px; line-height: 1.45; font-size: 14.5px; white-space: pre-wrap; animation: pop .35s var(--spring); }
.msg.bot { background: var(--glass-solid); align-self: flex-start; border-bottom-left-radius: 6px; }
.msg.me { background: var(--blue); color: #fff; align-self: flex-end; border-bottom-right-radius: 6px; }
@keyframes pop { from { transform: scale(.94) translateY(6px); opacity: 0 } to { transform: none; opacity: 1 } }
.chatbar { position: sticky; bottom: -22px; display: flex; gap: 6px; padding: 10px 0 4px; }
.chatbar input { flex: 1; border: 1px solid var(--hair); background: var(--glass-solid); border-radius: 999px; padding: 10px 14px; outline: none; }
.card { background: var(--glass-solid); border-radius: 16px; padding: 11px 13px; margin: 6px 0; animation: pop .35s var(--spring); }
.typing i { display: inline-block; width: 6px; height: 6px; background: var(--muted); margin: 0 2px; animation: blink 1s infinite steps(2); }
.typing i:nth-child(2) { animation-delay: .15s } .typing i:nth-child(3) { animation-delay: .3s }

/* Confiance */
.graph { width: 100%; max-width: 300px; display: block; margin: 0 auto; }
.person { display: flex; gap: 11px; padding: 12px 0; border-top: 1px solid var(--hair); }
.quote { font-size: 13px; background: var(--tile); border-radius: 12px; padding: 8px 10px; margin-top: 6px; line-height: 1.4; }

/* Toast + marqueur */
#toast { position: fixed; z-index: 60; left: 50%; top: 76px; transform: translate(-50%, -16px); opacity: 0; pointer-events: none; padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; transition: all .35s var(--spring); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
.pin { width: 20px; height: 20px; background: var(--blue); border: 3px solid #fff; box-shadow: 0 4px 14px rgba(0,119,204,.55); animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0,119,204,.5) } 70% { box-shadow: 0 0 0 16px rgba(0,119,204,0) } 100% { box-shadow: 0 0 0 0 rgba(0,119,204,0) } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
table.cmp { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.cmp td, table.cmp th { padding: 8px 4px; text-align: center; border-top: 1px solid var(--hair); }
table.cmp td:first-child { text-align: left; color: var(--muted); }
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map of San Francisco"></div>

<header class="topbar glass">
  <span id="logo"></span><span class="brand">Know Your Building</span>
  <form class="searchform" id="searchForm" role="search">
    <label for="address" class="sr">Address</label>
    <input id="address" autocomplete="off" placeholder="907 Valencia St">
    <button class="round" id="goBtn" aria-label="Search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  </form>
  <select class="langsel" id="lang" aria-label="Language"><option value="en">EN</option><option value="fr">FR</option><option value="es">ES</option><option value="zh">中文</option></select>
</header>

<div class="layers" id="layers" aria-label="Map layers"></div>
<section class="sheet glass" id="sheet"><button class="grab" id="grab" aria-label="Expand or collapse"><span></span></button><div class="body" id="body" aria-live="polite"></div></section>
<nav class="dock glass" id="dock" role="tablist" aria-label="Sections"></nav>
<div id="toast" class="glass" role="status"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script>
/* =====================================================================
   1) RÉGLAGES
   - page servie par le backend (port 8000) -> même origine
   - page servie à part (python3 -m http.server 5500 --directory frontend) -> http://localhost:8000
   ===================================================================== */
const API = location.port === '8000' ? '' : 'http://localhost:8000';
const SODA = 'https://data.sf.gov/resource/';
const OVERPASS = 'https://overpass-api.de/api/interpreter';
const SF = [37.7599, -122.4370];
const DEMO = ['907 Valencia St', '2288 Broadway', '3033 Cesar Chavez St'];
const daysAgo = n => new Date(Date.now() - n * 864e5).toISOString().slice(0, 10);

/* 2) TEXTES — tr('anglais', 'français'). ES/中文 : interface en anglais, rapport Mistral dans la langue. */
let lang = 'en';
const tr = (en, fr) => (lang === 'fr' ? fr : en);

/* =====================================================================
   3) OUTILS
   ===================================================================== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt$ = n => (n == null ? '–' : '$' + Math.round(n).toLocaleString('en-US'));
async function getJSON(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; try { e.body = await r.json(); } catch {} throw e; }
  return r.json();
}
const errMsg = e => (e && e.body && (e.body.detail || e.body.error || e.body.reason)) || (e && e.message === 'Failed to fetch'
  ? tr('Backend unreachable. Is uvicorn running on port 8000?', 'Backend injoignable. uvicorn tourne bien sur le port 8000 ?') : tr('Something went wrong.', 'Une erreur est survenue.'));
let toastT;
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* --- Pixels (touche Mistral) --- */
const ELASTIC = ['var(--yellow)', 'var(--pink)', 'var(--teal)', 'var(--sky)', 'var(--blue)'];
// Dessine un motif de pixels : rows = ['0110', ...] ; color = une couleur ou une fonction(ligne, colonne)
function pix(rows, color, size = 3) {
  const c = typeof color === 'function' ? color : () => color;
  return `<span class="pix" aria-hidden="true" style="grid-template-columns:repeat(${rows[0].length},${size}px);grid-auto-rows:${size}px">${rows.map((r, y) => [...r].map((v, x) => `<i style="background:${v === '1' ? c(y, x) : 'transparent'}"></i>`).join('')).join('')}</span>`;
}
const ICON = {
  logo: ['1111', '1011', '1101', '1011', '1001'],
  explore: ['0111110', '1100011', '1101011', '1100011', '0111110', '0011100', '0001000'],
  building: ['0111110', '0101010', '0111110', '0101010', '0111110', '0101010', '1111111'],
  chat: ['1111111', '1000001', '1010101', '1000001', '1111111', '0110000', '0100000'],
  trust: ['0011100', '0011100', '0011100', '0000000', '0111110', '1111111', '1111111'],
  works: ['0001000', '0011100', '0011100', '0111110', '0111110', '1111111', '1111111'],   // cône de chantier
  shield: ['1111111', '1111111', '1110111', '1110111', '0111110', '0011100', '0001000'],   // bouclier
  home: ['0001000', '0011100', '0111110', '1111111', '0110110', '0110110', '0111110'],
  info: ['0011100', '0011100', '0000000', '0011100', '0011100', '0011100', '0111110'],
};
const pixline = () => `<div class="pixline" aria-hidden="true">${ELASTIC.map(c => `<i style="background:${c}"></i>`).join('')}</div>`;
const LOADER = `<div class="loader" aria-hidden="true">${ELASTIC.map(c => `<i style="background:${c}"></i>`).join('')}</div>`;
const STATUS = { good: 'var(--good)', warn: 'var(--warn)', bad: 'var(--bad)', none: 'var(--faint)' };
const statusOf = lvl => ({ green: 'good', orange: 'warn', red: 'bad' }[lvl] || 'warn');
function gauge(level) {             // jauge de risque en 12 blocs
  const n = { good: 3, warn: 7, bad: 11 }[level] ?? 6;
  return `<div class="gauge" aria-hidden="true">${Array.from({ length: 12 }, (_, i) => `<i style="background:${i < n ? STATUS[level] : ''};opacity:${i < n ? 0.45 + 0.55 * (i + 1) / n : 1}"></i>`).join('')}</div>`;
}
const prate = v => `<span class="prate" aria-label="${v}/5">${[1, 2, 3, 4, 5].map(i => `<i style="background:${i <= Math.round(v) ? 'var(--teal)' : ''}"></i>`).join('')}</span>`;
const tag = (level, text) => `<span class="tag ${level}"><i class="dot" style="background:${STATUS[level]}"></i>${text}</span>`;

   4) ÉTAT

  tab: 'explore', zone: 'price', works: false, shops: false,
  hoods: null, rent: {}, crime: {}, budget: 3000,
  query: '', building: null, report: null, community: null, safety: null, buildingTab: 'report', lease: null, open: {},
  chat: [], slots: {}, lastAsked: null, chatBackend: null,

/* =====================================================================
   5) CARTE — fond vectoriel OpenFreeMap (net à tous les zooms, sans clé)
   ===================================================================== */
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
const map = L.map('map', { zoomControl: false }).setView(SF, 12);
if (L.maplibreGL) {
  L.maplibreGL({ style: `https://tiles.openfreemap.org/styles/${dark ? 'dark' : 'positron'}`,
    attribution: '<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> © OpenStreetMap · DataSF' }).addTo(map);
} else {
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
}
const wide = () => innerWidth >= 900;
const PAD = () => (wide() ? { paddingTopLeft: [430, 70], paddingBottomRight: [60, 100] } : { paddingTopLeft: [20, 120], paddingBottomRight: [20, 380] });
map.fitBounds([[37.708, -122.515], [37.812, -122.357]], PAD());
let hoodLayer = null, buildingMarker = null;
const worksLayer = L.layerGroup().addTo(map), shopsLayer = L.layerGroup().addTo(map), crimePts = L.layerGroup().addTo(map), routeLayer = L.layerGroup().addTo(map);

// Échelle Elastic : turquoise (bas) -> jaune -> rouge rosé (haut)
function ramp(t) {
  t = Math.max(0, Math.min(1, t));
  const st = [[11, 165, 150], [254, 197, 20], [229, 69, 90]];
  const [a, b, k] = t < .5 ? [st[0], st[1], t * 2] : [st[1], st[2], (t - .5) * 2];
  return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * k)).join(',')})`;
}
const rankOf = obj => { const v = Object.values(obj).filter(x => x != null).sort((a, b) => a - b); return x => (x == null || !v.length ? null : v.indexOf(x) / Math.max(1, v.length - 1)); };
const crimeLevel = r => (r == null ? 'none' : r < .34 ? 'good' : r < .67 ? 'warn' : 'bad');
const crimeWord = r => ({ good: tr('low', 'faible'), warn: tr('medium', 'moyenne'), bad: tr('high', 'élevée'), none: '–' }[crimeLevel(r)]);

function hoodStyle(f) {
  const n = f.properties.nhood; let fill = 'transparent', op = 0;
  if (S.zone === 'price' && S.rent[n] != null) { fill = ramp(rankOf(S.rent)(S.rent[n])); op = S.rent[n] > S.budget ? 0.08 : 0.32; }
  if (S.zone === 'crime' && S.crime[n] != null) { fill = ramp(rankOf(S.crime)(S.crime[n])); op = 0.3; }
  if (map.getZoom() >= 15) op = 0;             // en vue rue : seulement les contours
  return { color: dark ? 'rgba(255,255,255,.28)' : 'rgba(16,28,63,.22)', weight: 1, fillColor: fill, fillOpacity: op };
}
const hoodPopup = n => `<b>${esc(n)}</b><br>${tr('Median 1-bed rent', 'Loyer médian 1 ch.')} <b>${fmt$(S.rent[n])}</b><br>${tr('Crime', 'Criminalité')} <b>${crimeWord(rankOf(S.crime)(S.crime[n]))}</b> · ${esc(S.crime[n] ?? '–')} ${tr('incidents / 90 days', 'incidents / 90 j')}`;

async function loadHoods() {
  const ONE = ['1', 'One-Bedroom', 'One-bedroom', 'One Bedroom', '1 bedroom', '1 Bedroom', '1br', '1bedroom', '1 bed'].map(s => `'${s}'`).join(',');
  const [geo, rents, crime] = await Promise.all([
    getJSON(SODA + 'j2bu-swwd.geojson'),
    getJSON(SODA + `gdc7-dmcn.json?$select=analysis_neighborhood,monthly_rent,count(*) as n&$where=bedroom_count in(${ONE})&$group=analysis_neighborhood,monthly_rent&$limit=5000`),
    getJSON(SODA + `wg3w-h783.json?$select=analysis_neighborhood,count(*) as n&$where=incident_date>'${daysAgo(90)}'&$group=analysis_neighborhood&$limit=100`),
  ]);
  // Loyers déclarés en fourchettes ("$1001-$1250") -> milieu, puis médiane pondérée par quartier
  const by = {};
  rents.forEach(r => { const m = String(r.monthly_rent || '').match(/\$(\d+)\D+(\d+)/); if (!m || !r.analysis_neighborhood) return;
    const mid = (+m[1] + +m[2]) / 2; if (mid >= 500) (by[r.analysis_neighborhood] ||= []).push([mid, +r.n]); });
  for (const [h, a] of Object.entries(by)) { a.sort((x, y) => x[0] - y[0]); const t = a.reduce((s, x) => s + x[1], 0); let c = 0; for (const [v, n] of a) { c += n; if (c >= t / 2) { S.rent[h] = v; break; } } }
  crime.forEach(c => { if (c.analysis_neighborhood) S.crime[c.analysis_neighborhood] = +c.n; });
  S.hoods = geo;
  hoodLayer = L.geoJSON(geo, { style: hoodStyle, onEachFeature: (f, l) => {
    l.bindPopup(() => hoodPopup(f.properties.nhood));
    l.on('mouseover', () => l.setStyle({ weight: 2 })); l.on('mouseout', () => l.setStyle({ weight: 1 })); } }).addTo(map);
  renderLayers(); if (S.tab === 'explore') render();
}
function restyle() { if (hoodLayer) hoodLayer.setStyle(hoodStyle); renderLayers(); }
function focusHood(n) {
  if (!hoodLayer) return;
  hoodLayer.eachLayer(l => { if (l.feature.properties.nhood === n) { map.flyToBounds(l.getBounds(), { ...PAD(), duration: .9 }); setTimeout(() => l.openPopup(), 950); } });
  collapseMobile();
}
async function loadWorks() {
  worksLayer.clearLayers(); if (!S.works || map.getZoom() < 15) return;
  const b = map.getBounds();
  try {
    const rows = await getJSON(SODA + `i98e-djp9.json?$select=location,permit_type_definition,description,status,filed_date,estimated_cost&$where=within_box(location,${b.getNorth()},${b.getWest()},${b.getSouth()},${b.getEast()}) AND filed_date>'${daysAgo(365)}'&$limit=400`);
    rows.forEach(r => { if (!r.location) return; const [lon, lat] = r.location.coordinates;
      L.circleMarker([lat, lon], { radius: 5.5, color: '#fff', weight: 1.5, fillColor: '#FEC514', fillOpacity: 1 })
        .bindPopup(`<b>${esc(r.permit_type_definition)}</b><br>${esc((r.description || '').slice(0, 140))}<br><span style="opacity:.65">${esc((r.filed_date || '').slice(0, 10))} · ${esc(r.status)}${r.estimated_cost ? ' · ' + fmt$(+r.estimated_cost) : ''}</span>`).addTo(worksLayer); });
  } catch {}
}
const SHOPC = { food: '#00BFB3', shop: '#1BA9F5', health: '#F04E98', other: '#8A92A6' };
async function loadShops() {
  shopsLayer.clearLayers(); if (!S.shops || map.getZoom() < 16) return;
  const b = map.getBounds(), bb = `${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()}`;
  try {
    const d = await getJSON(OVERPASS + '?data=' + encodeURIComponent(`[out:json][timeout:15];(node[shop](${bb});node[amenity~"^(cafe|restaurant|pharmacy|bank|bar|fast_food|clinic)$"](${bb}););out 250;`));
    d.elements.forEach(e => { const t = e.tags || {}, a = t.amenity, k = /cafe|restaurant|bar|fast_food/.test(a) ? 'food' : /pharmacy|clinic/.test(a) ? 'health' : t.shop ? 'shop' : 'other';
      L.circleMarker([e.lat, e.lon], { radius: 4.5, color: '#fff', weight: 1, fillColor: SHOPC[k], fillOpacity: 1 }).bindPopup(`<b>${esc(t.name || t.shop || a)}</b><br><span style="opacity:.65">${esc(t.shop || a || '')}</span>`).addTo(shopsLayer); });
  } catch {}
}
async function loadCrimePts() {
  crimePts.clearLayers(); if (S.zone !== 'crime' || !S.building) return;
  try {
    const rows = await getJSON(SODA + `wg3w-h783.json?$select=latitude,longitude,incident_category,incident_date&$where=within_circle(point,${S.building.lat},${S.building.lon},400) AND incident_date>'${daysAgo(90)}'&$limit=600`);
    rows.forEach(r => { if (r.latitude) L.circleMarker([+r.latitude, +r.longitude], { radius: 3.5, stroke: false, fillColor: '#E5455A', fillOpacity: .5 })
      .bindPopup(`${esc(r.incident_category)}<br><span style="opacity:.65">${esc((r.incident_date || '').slice(0, 10))}</span>`).addTo(crimePts); });
  } catch {}
}
map.on('zoomend', () => hoodLayer && hoodLayer.setStyle(hoodStyle));
let moveT; map.on('moveend', () => { clearTimeout(moveT); moveT = setTimeout(() => { loadWorks(); loadShops(); renderLayers(); }, 400); });

function renderLayers() {
  const z = map.getZoom();
  const hint = (S.works && z < 15) || (S.shops && z < 16) ? tr('Zoom in to see points', 'Zoome pour voir les points') : '';
  const legend = S.zone === 'none' ? '' : `<div class="legend glass">${S.zone === 'price' ? tr('Median 1-bed rent', 'Loyer médian 1 chambre') : tr('Police incidents, 90 days', 'Incidents police, 90 jours')}
    <div class="ramp">${Array.from({ length: 8 }, (_, i) => `<span style="background:${ramp(i / 7)}"></span>`).join('')}</div>
    <div class="ends"><span>${S.zone === 'price' ? tr('cheaper', 'moins cher') : tr('fewer', 'moins')}</span><span>${S.zone === 'price' ? tr('pricier', 'plus cher') : tr('more', 'plus')}</span></div>${hint ? `<div style="margin-top:4px">${hint}</div>` : ''}</div>`;
  const b = (k, on, label, color) => `<button class="lbtn" data-l="${k}" aria-pressed="${on}"><i style="background:${color}"></i>${label}</button>`;
  $('layers').innerHTML = `<div class="lpill glass" role="group" aria-label="Layers">
      ${b('price', S.zone === 'price', tr('Price', 'Prix'), 'var(--teal)')}${b('crime', S.zone === 'crime', tr('Safety', 'Sécurité'), 'var(--bad)')}
      ${b('works', S.works, tr('Works', 'Travaux'), 'var(--yellow)')}${b('shops', S.shops, tr('Shops', 'Commerces'), 'var(--sky)')}</div>
    ${S.hoods ? legend : `<div class="legend glass">${tr('Loading city data…', 'Chargement des données…')}</div>`}`;
  $('layers').querySelectorAll('[data-l]').forEach(el => el.onclick = () => {
    const k = el.dataset.l;
    if (k === 'price' || k === 'crime') { S.zone = S.zone === k ? 'none' : k; restyle(); loadCrimePts(); return; }
    S[k] = !S[k]; const need = k === 'works' ? 15 : 16;
    if (S[k] && map.getZoom() < need) map.flyTo(map.getCenter(), need, { duration: .8 }); else { loadWorks(); loadShops(); }
    renderLayers();
  });
}

function renderDock() {
  const tabs = [['explore', tr('Explore', 'Explorer')], ['building', tr('Building', 'Immeuble')], ['chat', tr('Assistant', 'Assistant')], ['trust', tr('Trust', 'Confiance')]];
  $('dock').innerHTML = tabs.map(([k, v]) => `<button role="tab" aria-selected="${S.tab === k}" data-tab="${k}">${pix(ICON[k], S.tab === k ? 'var(--blue)' : 'currentColor', 3)}<span>${v}</span></button>`).join('');
  $('dock').querySelectorAll('button').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; openSheet(); renderDock(); render(); });
}
function openSheet() { $('sheet').classList.remove('collapsed'); }
function collapseMobile() { if (!wide()) $('sheet').classList.add('collapsed'); }
$('grab').onclick = () => $('sheet').classList.toggle('collapsed');
function render() {

   7) EXPLORER
   ===================================================================== */
function ranking(budget, f = 1) {
  const cr = rankOf(S.crime), rr = rankOf(S.rent);
  return Object.keys(S.rent).map(n => { const c = cr(S.crime[n]) ?? .5, p = rr(S.rent[n]) ?? .5, rent = S.rent[n] * f;
    return { n, rent, c, fits: rent <= budget, score: (1 - c) * .6 + (1 - p) * .4 }; }).sort((a, b) => (b.fits - a.fits) || (b.score - a.score));
}
function vExplore() {
  const head = `${pixline()}<h1>${tr('Where could you live?', 'Où pourrais-tu vivre ?')}</h1>`;
  if (!S.hoods) return head + LOADER + `<div class="loadmsg">${tr('Reading rents and safety data…', 'Lecture des loyers et de la sécurité…')}</div>`;
  const list = ranking(S.budget).slice(0, 8);
  return `${head}<p class="muted small">${tr('Move the budget: neighborhoods out of reach fade on the map.', 'Bouge le budget : les quartiers hors budget s’effacent sur la carte.')}</p>
  <div class="tile"><div class="row"><b class="small">${tr('Budget · 1 bedroom', 'Budget · 1 chambre')}</b><span class="num" id="bv" style="font-size:18px">${fmt$(S.budget)}</span></div>
    <input type="range" id="budget" min="1000" max="6000" step="100" value="${S.budget}" aria-label="Budget"></div>
  <div class="label">${tr('Safe & affordable', 'Sûrs et abordables')}</div>
  <ul class="list">${list.map(h => `<li class="row click" data-hood="${esc(h.n)}" tabindex="0">
      <span style="display:flex;align-items:center;gap:10px;min-width:0"><i class="dot" style="width:10px;height:10px;background:${ramp(rankOf(S.rent)(S.rent[h.n]))}"></i>
      <span style="min-width:0"><b>${esc(h.n)}</b><br><span class="tiny muted">${fmt$(h.rent)} · ${tr('crime', 'criminalité')} ${crimeWord(h.c)}</span></span></span>
      ${h.fits ? tag('good', tr('in budget', 'ok budget')) : tag('none', tr('over', 'trop cher'))}</li>`).join('')}</ul>
  ${followSection()}
  <div class="label">${tr('Check a building', 'Vérifier un immeuble')}</div>${chipsDemo()}
  <p class="foot">${tr('Rents: SF Rent Board inventory (self-reported, 1 bedroom), below market asking rents. Safety: SFPD reports, 90 days. Prototype: listings and network are demo data.', 'Loyers : inventaire du Rent Board (déclarés, 1 chambre), plus bas que les loyers affichés. Sécurité : rapports SFPD, 90 jours. Prototype : annonces et réseau de démonstration.')}</p>`;
}
function bExplore() {
  const r = $('budget'); if (r) r.oninput = () => { S.budget = +r.value; $('bv').textContent = fmt$(S.budget); restyle(); clearTimeout(r._t); r._t = setTimeout(render, 250); };
  document.querySelectorAll('[data-hood]').forEach(el => { el.onclick = () => focusHood(el.dataset.hood); el.onkeydown = e => e.key === 'Enter' && focusHood(el.dataset.hood); });
  bindAddr(); bindFollow();
}

async function search() {
  const q = $('address').value.trim(); if (!q) return;
  S.tab = 'building'; renderDock(); openSheet();
  const steps = [tr('Finding the building…', 'Recherche de l’immeuble…'), tr('Reading city records…', 'Lecture des registres de la ville…'), tr('Mistral is writing your report…', 'Mistral rédige ton rapport…')];
  let i = 0; const show = () => { $('body').innerHTML = `${pixline()}<h1>${esc(q)}</h1>${LOADER}<div class="loadmsg">${esc(steps[i])}</div>`; };
  show(); const tm = setInterval(() => { if (i < 2) { i++; show(); } }, 2500); $('goBtn').disabled = true;
  try {
    const res = await getJSON(`${API}/api/report?address=${encodeURIComponent(q)}&lang=${lang}`);
    Object.assign(S, { query: q, reportLang: lang, building: res.building, report: res.report, community: res.community, safety: null,
      buildingTab: 'report', lease: null, letter: null, commute: null, open: {} });
    routeLayer.clearLayers();
    const f = followed(); if (f) { f.diff = diffOf(snap(res.building), f.snap); saveFollow(); }
    S.bench = null; placeBuilding(); render(); loadSafety(); loadBench(q);
  } catch (e) {
    $('body').innerHTML = `${pixline()}<h1>${esc(q)}</h1><div class="err">${esc(e.status === 404 ? tr('Address not found in San Francisco.', 'Adresse introuvable à San Francisco.') : errMsg(e))}</div>`;
  } finally { clearInterval(tm); $('goBtn').disabled = false; }
}
function placeBuilding() {
  const b = S.building; if (!b || !b.lat) return;
  if (buildingMarker) buildingMarker.remove();
  buildingMarker = L.marker([b.lat, b.lon], { icon: L.divIcon({ className: '', html: '<div class="pin"></div>', iconSize: [20, 20], iconAnchor: [10, 10] }) }).addTo(map);
  const pt = map.project([b.lat, b.lon], 16), off = wide() ? [-200, 0] : [0, 140];
  map.flyTo(map.unproject(pt.add(off), 16), 16, { duration: 1.1 });
  loadCrimePts();
}
// Sécurité autour de l'immeuble : incidents SFPD à 400 m sur 90 jours, par catégorie
async function loadSafety() {
  const b = S.building;
  try {
    const rows = await getJSON(SODA + `wg3w-h783.json?$select=incident_category,count(*) as n&$where=within_circle(point,${b.lat},${b.lon},400) AND incident_date>'${daysAgo(90)}'&$group=incident_category&$order=n DESC&$limit=40`);
    S.safety = { total: rows.reduce((s, r) => s + +r.n, 0), cats: rows.filter(r => r.incident_category).slice(0, 4).map(r => [r.incident_category, +r.n]) };
  } catch { S.safety = { error: true }; }
  if (S.tab === 'building' && S.buildingTab === 'report' && S.building === b) render();
}

}
const RATING_KEYS = ['overall', 'landlord_responsiveness', 'maintenance', 'noise', 'safety'];
const rLabel = k => ({ overall: tr('Overall', 'Global'), landlord_responsiveness: tr('Landlord', 'Propriétaire'), maintenance: tr('Maintenance', 'Entretien'), noise: tr('Noise', 'Bruit'), safety: tr('Safety', 'Sécurité') }[k]);

  late_payments: tr('late payments', 'retards de paiement'), access_denial: tr('access denial', 'refus d’accès'), unapproved_subtenant: tr('unapproved subtenant', 'sous-locataire non autorisé'),

// Un thème du rapport : icône pixel, titre, statut, résumé en une ligne, détail dépliable

}
const stat = (v, label) => `<div class="stat"><span class="num">${esc(v ?? '–')}</span><span>${label}</span></div>`;
const srcLink = (b, k) => (b.sources || {})[k] ? `<a class="src" href="${esc(b.sources[k])}" target="_blank" rel="noopener">${tr('Source', 'Source')}: DataSF ↗</a>` : '';
function bReport() {

const FKEY = 'kyb_follow';
S.follow = (() => { try { return JSON.parse(localStorage.getItem(FKEY) || '[]'); } catch { return []; } })();

const snap = b => ({ open: b.stats?.open_complaints ?? 0, viol: b.stats?.violations_10y ?? 0, ev: b.stats?.evictions_block_10y ?? 0, permits: b.permits_5y ?? 0 });
const diffOf = (now, before) => Object.fromEntries(Object.keys(now).map(k => [k, now[k] - (before[k] ?? 0)]));
const followed = () => S.building && S.follow.find(f => f.address === S.building.matched_address);
function diffHtml(f) {
  if (!f.diff) return `<span class="tiny muted">${tr('Following since', 'Suivi depuis le')} ${esc(f.at)}</span>`;
  const lab = { open: tr('open complaints', 'plaintes ouvertes'), viol: tr('violations', 'infractions'), ev: tr('evictions on block', 'évictions sur le bloc'), permits: tr('permits', 'permis') };
  const items = Object.entries(f.diff).filter(([, v]) => v);
  return items.length ? items.map(([k, v]) => tag(k === 'permits' ? 'warn' : v > 0 ? 'bad' : 'good', `${v > 0 ? '+' : ''}${v} ${lab[k]}`)).join(' ') : tag('good', `${tr('Nothing new since', 'Rien de nouveau depuis le')} ${esc(f.at)}`);
}
function toggleFollow() {
  const f = followed();

}

function addCompare() {

function bCompare() {
  if (S.compare.length < 2) return `<div class="tile"><h2>${tr('Compare two buildings', 'Comparer deux immeubles')}</h2>
    <p class="small muted">${S.compare.length ? tr(`${S.compare[0].b.matched_address} is saved. Search another building, then tap ⇄ Compare.`, `${S.compare[0].b.matched_address} est gardé. Cherche un autre immeuble puis appuie sur ⇄ Comparer.`) : tr('Tap ⇄ Compare on two buildings.', 'Appuie sur ⇄ Comparer sur deux immeubles.')}</p>${chipsDemo()}</div>`;
  const [A, B] = S.compare;
  const rows = [
    [tr('Open complaints', 'Plaintes ouvertes'), x => x.b.stats?.open_complaints, 'low'],
    [tr('Violations, 10 yrs', 'Infractions, 10 ans'), x => x.b.stats?.violations_10y, 'low'],
    [tr('Evictions on block', 'Évictions sur le bloc'), x => x.b.stats?.evictions_block_10y, 'low'],
    [tr('Fire calls, 5 yrs', 'Pompiers, 5 ans'), x => x.b.fire_incidents_5y, 'low'],
    [tr('Tenant rating', 'Note locataires'), x => x.c?.avg_ratings?.overall, 'high'],
    [tr('Rent control', 'Contrôle des loyers'), x => (x.b.profile?.likely_rent_controlled ? 1 : 0), 'high', v => (v ? '✓' : '–')],
    [tr('Built', 'Construit'), x => x.b.profile?.year_built, ''],
    [tr('Units', 'Logements'), x => x.b.profile?.units, ''],
  ];
  let wa = 0, wb = 0;
  const body = rows.map(([label, get, better, show = v => (v == null ? '–' : v)]) => {
    const a = get(A), b = get(B), ok = better && a != null && b != null && a !== b, aw = ok && ((better === 'low') === (a < b)), bw = ok && !aw;
    if (aw) wa++; if (bw) wb++;
    const td = (v, w) => `<td>${w ? `<span class="tag good">${esc(show(v))}</span>` : `<span class="num">${esc(show(v))}</span>`}</td>`;
    return `<tr><td>${label}</td>${td(a, aw)}${td(b, bw)}</tr>`;
  }).join('');

function personCard(p, withListing) {
  const sc = trustScore(p);
  return `<div class="person"><div class="av" style="background:${p.color};border-radius:6px">${esc(p.name[0])}</div><div style="flex:1;min-width:0">
    <div class="row"><b>${esc(p.name)}</b><span class="tiny muted">${esc(roleLabel(p.role))}</span></div>
    <div class="tiny muted">${esc(degreeLabel(p))} · ${p.recs} ${tr('recommendations', 'recommandations')}</div>
    ${p.verified ? `<div class="vbadge">${pix(['01110', '11111', '11011', '10101', '01110'], 'var(--good)', 2)} ${tr('ID verified', 'Identité vérifiée')}</div>` : ''}
    <div class="row tiny" style="margin-top:6px"><span class="muted">${tr('Trust', 'Confiance')}</span><span style="display:flex;align-items:center;gap:6px"><span class="prate">${Array.from({ length: 10 }, (_, i) => `<i style="background:${i < Math.round(sc / 10) ? 'var(--teal)' : ''}"></i>`).join('')}</span><b class="num">${sc}</b></span></div>
    ${withListing && p.listing ? `<div class="card"><div class="row"><b class="small">${esc(p.listing.title)}</b><span class="num" style="color:var(--blue)">${fmt$(p.listing.rent)}</span></div><div class="tiny muted">${tr('Only visible to your network', 'Visible seulement par ton réseau')}</div></div>` : ''}
    ${(p.endorsements || []).slice(0, withListing ? 1 : 3).map(e => `<div class="quote">“${esc(e.text)}”<div class="tiny muted">— ${esc(e.from)}</div></div>`).join('')}
    <div style="margin-top:8px"><button class="btn sm ghost" data-contact="${p.id}" ${S.asked[p.id] ? 'disabled' : ''}>${S.asked[p.id] ? tr('Request sent', 'Demande envoyée') : tr('Ask to talk', 'Demander à échanger')}</button></div></div></div>`;
}
const tListings = () => PEOPLE.filter(p => p.listing).sort((a, b) => a.degree - b.degree).map(p => personCard(p, true)).join('');
function tPeople() {
  const ts = (S.community && S.community.contactable_tenants) || [];
  return `${ts.length ? `<div class="label">${tr('Tenants of', 'Locataires du')} ${esc(S.building.matched_address)}</div>` + ts.map(t => `<div class="person"><div class="av" style="background:var(--teal)">${esc((t.pseudo || '?')[0].toUpperCase())}</div><div style="flex:1;min-width:0">
      <b>${esc(t.pseudo)}</b><div class="tiny muted">${esc(t.bio || '')}${t.demo ? ` ${tag('none', tr('fictional example', 'exemple fictif'))}` : ''}</div>${t.verified ? `<div class="vbadge">${pix(['01110', '11111', '11011', '10101', '01110'], 'var(--good)', 2)} ${tr('Verified tenant', 'Locataire vérifié')}</div>` : ''}
      <div style="margin-top:8px"><button class="btn sm ghost" data-real="${esc(t.id)}" ${S.asked['r' + t.id] ? 'disabled' : ''}>${S.asked['r' + t.id] ? tr('Request sent', 'Demande envoyée') : tr('Ask to talk', 'Demander à échanger')}</button></div></div></div>`).join('') : ''}
    <div class="label">${tr('Your network', 'Ton réseau')}</div>${[...PEOPLE].sort((a, b) => trustScore(b) - trustScore(a)).map(p => personCard(p)).join('')}`;
}
function tRecommend() {
  return `<form id="recForm" class="tile"><h2>${tr('Vouch for someone', 'Recommander quelqu’un')}</h2>
    <p class="tiny muted">${tr('Shown on their profile with your name. Only vouch for people you really know.', 'Affiché sur son profil avec ton nom. Ne recommande que des gens que tu connais vraiment.')}</p>
    <div class="field"><label for="recWho">${tr('Who', 'Qui')}</label><input class="input" id="recWho" required></div>
    <div class="field"><label for="recRel">${tr('Relationship', 'Votre lien')}</label><select class="input" id="recRel"><option value="friend">${tr('Friend', 'Ami·e')}</option><option value="roommate">${tr('Former roommate', 'Ancien·ne coloc')}</option><option value="tenant">${tr('My former tenant', 'Mon ancien·ne locataire')}</option><option value="landlord">${tr('My former landlord', 'Mon ancien·ne propriétaire')}</option><option value="colleague">${tr('Colleague', 'Collègue')}</option></select></div>
    <div class="field"><label for="recText">${tr('What do you vouch for?', 'De quoi te portes-tu garant·e ?')}</label><textarea class="input" id="recText" required placeholder="${tr('Pays on time, respectful of neighbors…', 'Paie à l’heure, respecte les voisins…')}"></textarea></div>
    <label class="small"><input type="checkbox" id="recYear" required> ${tr('I’ve known this person for over a year', 'Je connais cette personne depuis plus d’un an')}</label>
    <div style="margin-top:10px"><button class="btn block">${tr('Publish', 'Publier')}</button></div></form>`;
}
function tRoommates() {
  if (S.matches) return `<div class="label">${tr('Your matches', 'Tes matchs')}</div>` + (S.matches.map(m => `<div class="card"><div class="row"><b>${esc(m.profile.pseudo)}</b><span class="num" style="color:var(--good)">${Math.round(m.score <= 1 ? m.score * 100 : m.score)}%</span></div><div class="tiny muted">${esc(m.profile.neighborhood || '')}</div><p class="small">${esc(m.why)}</p></div>`).join('') || `<p class="muted">${tr('No match yet.', 'Pas encore de match.')}</p>`);
  const sel = (id, v) => `<select class="input" id="${id}">${v.map(([a, b]) => `<option value="${a}">${b}</option>`).join('')}</select>`;
  return `<form id="rmForm" class="tile"><h2>${tr('Find a roommate', 'Trouver un coloc')}</h2><p class="tiny muted">${tr('We never ask about origin, religion, gender or similar.', 'Nous ne demandons jamais l’origine, la religion, le genre, etc.')}</p>
    <div class="field"><label for="m_pseudo">${tr('Pseudonym', 'Pseudo')}</label><input class="input" id="m_pseudo" required maxlength="40"></div>
    <div class="g2"><div class="field"><label for="m_role">${tr('I am', 'Je suis')}</label>${sel('m_role', [['seeking_roommate', tr('looking', 'je cherche')], ['has_room', tr('I have a room', 'j’ai une chambre')]])}</div><div class="field"><label for="m_hood">${tr('Neighborhood', 'Quartier')}</label><input class="input" id="m_hood" value="${esc(S.building?.neighborhood || (S.slots.area !== 'any' && S.slots.area) || '')}"></div></div>
    <div class="g2"><div class="field"><label for="m_bmin">${tr('Budget min', 'Budget min')}</label><input class="input" type="number" id="m_bmin" value="1200"></div><div class="field"><label for="m_bmax">${tr('Budget max', 'Budget max')}</label><input class="input" type="number" id="m_bmax" value="${S.slots.budget || 2000}"></div></div>
    <div class="g3"><div class="field"><label for="m_sched">${tr('Schedule', 'Rythme')}</label>${sel('m_sched', [['early', tr('early', 'tôt')], ['flexible', 'flexible'], ['late', tr('late', 'tard')]])}</div><div class="field"><label for="m_clean">${tr('Tidiness', 'Propreté')}</label>${sel('m_clean', [1, 2, 3, 4, 5].map(n => [n, n]))}</div><div class="field"><label for="m_guests">${tr('Guests', 'Invités')}</label>${sel('m_guests', [['rarely', tr('rarely', 'rarement')], ['sometimes', tr('sometimes', 'parfois')], ['often', tr('often', 'souvent')]])}</div></div>
    <button class="btn block" id="mBtn">${tr('Find matches', 'Trouver des matchs')}</button><div id="mMsg"></div></form>`;
}
async function ensureProfile() {
  if (S.myProfile) return S.myProfile;
  const pseudo = prompt(tr('Choose a pseudonym:', 'Choisis un pseudo :')); if (!pseudo) return null;
  S.myProfile = await getJSON(`${API}/api/profiles`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pseudo, role: 'seeking_roommate', open_to_contact: true }) });
  return S.myProfile;
}
function bTrust() {
  document.querySelectorAll('[data-tt]').forEach(b => b.onclick = () => { S.trustTab = b.dataset.tt; render(); });
  $('inviteBtn').onclick = async () => { try { await navigator.clipboard.writeText(location.origin + location.pathname + '?invite=' + Math.random().toString(36).slice(2, 8)); } catch {} toast(tr('Invite link copied', 'Lien d’invitation copié')); };
  $('askRecBtn').onclick = () => toast(tr('Request sent to your friends', 'Demande envoyée à tes amis'));
  document.querySelectorAll('[data-contact]').forEach(b => b.onclick = () => { S.asked[b.dataset.contact] = true; render(); toast(tr('Request sent', 'Demande envoyée')); });
  document.querySelectorAll('[data-real]').forEach(b => b.onclick = async () => {
    try { const me = await ensureProfile(); if (!me) return;
      await getJSON(`${API}/api/contact`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ from_profile_id: me.id, to_profile_id: +b.dataset.real, message: '' }) });
      S.asked['r' + b.dataset.real] = true; render(); toast(tr('Request sent', 'Demande envoyée')); } catch (e) { toast(errMsg(e)); }
  });
  const rf = $('recForm');
  if (rf) rf.onsubmit = e => { e.preventDefault();
    const who = $('recWho').value.trim(), rel = $('recRel'), ex = PEOPLE.find(p => p.name.toLowerCase() === who.toLowerCase());
    const end = { from: tr('You', 'Toi') + ' · ' + rel.options[rel.selectedIndex].text, text: $('recText').value.trim() };
    if (ex) { ex.recs++; (ex.endorsements ||= []).unshift(end); }
    else PEOPLE.push({ id: 'n' + Date.now(), name: who, role: rel.value === 'tenant' ? 'tenant' : rel.value === 'landlord' ? 'landlord' : 'friend', degree: 1, verified: false, recs: 1, color: '#F04E98', endorsements: [end] });
    S.trustTab = 'people'; render(); toast(tr('Recommendation published', 'Recommandation publiée')); };
  const mf = $('rmForm');
  if (mf) mf.onsubmit = async e => { e.preventDefault(); $('mBtn').disabled = true; $('mMsg').innerHTML = LOADER;
    const num = id => ($(id).value ? +$(id).value : null);
    const profile = { pseudo: $('m_pseudo').value.trim(), role: $('m_role').value, neighborhood: $('m_hood').value.trim() || null, blklot: $('m_role').value === 'has_room' && S.building ? S.building.blklot : null,
      budget_min: num('m_bmin'), budget_max: num('m_bmax'), lifestyle: { schedule: $('m_sched').value, cleanliness: +$('m_clean').value, guests: $('m_guests').value }, open_to_contact: true };
    try { S.myProfile = await getJSON(`${API}/api/profiles`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(profile) });
      S.matches = await getJSON(`${API}/api/roommates?profile_id=${S.myProfile.id}`); render(); }
    catch (err) { $('mMsg').innerHTML = `<div class="err">${esc(errMsg(err))}</div>`; $('mBtn').disabled = false; }
  };
}

/* =====================================================================
   15) DÉMARRAGE
   ===================================================================== */
$('logo').innerHTML = pix(ICON.logo, (y) => ELASTIC[y], 5);
$('searchForm').onsubmit = e => { e.preventDefault(); search(); };
$('lang').onchange = e => { lang = e.target.value; document.documentElement.lang = lang; renderDock(); renderLayers(); render();
  if (S.building && S.reportLang !== lang) { $('address').value = S.query; search(); } };
const qp = new URLSearchParams(location.search);
if (qp.get('lang')) { lang = qp.get('lang'); $('lang').value = lang; document.documentElement.lang = lang; }
renderDock(); renderLayers(); render();
loadHoods().catch(() => { $('layers').innerHTML = `<div class="legend glass">${tr('City data unavailable', 'Données de la ville indisponibles')}</div>`; });
if (qp.get('address')) { $('address').value = qp.get('address'); search(); }
</script>
</body>
</html>
