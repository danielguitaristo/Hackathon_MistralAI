# Déploiement Render (https://render.com) : un seul service web qui sert l'API FastAPI
# et le front (frontend/index.html est monté sur "/" par backend/main.py).
# La clé Mistral n'est jamais dans ce fichier : Render la demande à la création (sync: false).
services:
  - type: web
    name: know-your-building
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: MISTRAL_API_KEY
        sync: false
